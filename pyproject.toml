[project]
name = "claude-code-modal-self-hosted"
version = "0.1.0"
description = "Claude Code self-hosted environments on Modal"
requires-python = ">=3.12,<3.15"
dependencies = [
    "modal==1.5.5",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
