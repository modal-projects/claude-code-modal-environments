      .detail { font-size: 13px; fill: #52636f; text-anchor: middle; }
      .box { fill: white; stroke: #aac6b8; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #52636f; stroke-width: 2; marker-end: url(#arrow); }
